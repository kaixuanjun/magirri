org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# LiquidGlassView 的 AAR 声明了 compileSdk 37；它实际只用 33+ 的 API，先放开这项检查
android.experimental.disableCompileSdkChecks=true
kotlin.code.style=official

# 工程路径含中文（"桌面-凤纹方尊"）。AGP 默认会拒绝非 ASCII 路径，
# 这里显式放行；若后续 aapt2 / kotlinc 因路径报错，把工程镜像到纯 ASCII
# 目录再构建即可（见 README 的"构建"一节）。
android.overridePathCheck=true
