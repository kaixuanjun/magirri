[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magicrri"
version = "0.1.0"
description = "Magic-Log → LogC3 reference pipeline (desktop verification)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=9"]

[project.scripts]
magicrri = "magicrri.__main__:main"

[tool.setuptools]
packages = ["magicrri"]
